<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffdf8" />
    <meta name="description" content="LINEスタンプ画像を整理・確認し、提出用ZIPを作成するブラウザ完結アプリ" />
    <title>スタンプ工房 | LINEスタンプ制作サポート</title>
    <style>
:root { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif; color: #252525; background: #fffdf8; font-synthesis: none; }
* { box-sizing: border-box; } body { margin: 0; } button, input, textarea { font: inherit; } button { cursor: pointer; }
main { max-width: 680px; margin: auto; padding: env(safe-area-inset-top) 18px calc(42px + env(safe-area-inset-bottom)); overflow: hidden; }
.topbar { height: 66px; display:flex; align-items:center; gap:8px; font-size:15px; letter-spacing:.04em; }
.brand-mark { display:flex; align-items:end; gap:2px; width:20px; height:22px; } .brand-mark span { width:5px; border-radius:6px; background:#ff6a47; } .brand-mark span:nth-child(1) { height:11px }.brand-mark span:nth-child(2) { height:19px; background:#29323d }.brand-mark span:nth-child(3) { height:15px; background:#ffbb50 }.version { margin-left:auto; font: 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; color:#717171; border:1px solid #dedbd4; border-radius:20px; padding:4px 8px; }
.hero { padding:36px 5px 29px; position:relative; } .hero:after { content:'✦'; color:#ffb03e; position:absolute; right:6%; top:27px; font-size:30px; transform:rotate(13deg); } .eyebrow,.step { color:#f06445; font: 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing:.1em; margin:0 0 7px; } h1 { margin:0; font-size:35px; letter-spacing:-.07em; line-height:1.34; font-weight:800; } h1 em { color:#f06445; font-style:normal; font-family:-apple-system, BlinkMacSystemFont, 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif; letter-spacing:0; } .hero > p:last-child { color:#777; font-size:13px; margin:13px 0 0; }
.progress-card { background:#29323d; padding:17px 18px; border-radius:15px; color:#fff; box-shadow:4px 5px 0 #f6d9c6; margin-bottom:35px; }.progress-card>div:first-child { display:flex; justify-content:space-between; font-size:12px; }.progress-card b { font: 16px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; color:#ffc053 }.progress { height:5px; background:#57606a; margin:11px 0 8px; border-radius:4px; overflow:hidden }.progress i { display:block; height:100%; background:#ff7253; border-radius:4px; transition:width .3s }.progress-card small { font-size:10px; color:#c7cdd2; }
.section { padding:0 2px; margin:0 0 39px; } .section-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:17px; }.section-heading svg { color:#f06445 }.section-heading h2 { margin:0; font-size:20px; letter-spacing:-.04em; }.step { font-size:10px; margin-bottom:3px; }.count { background:#fff0d6; color:#b16926; padding:5px 9px; border-radius:12px; font:11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
label { display:block; font-size:12px; font-weight:600; margin-top:13px; } label small { font-size:9px; color:#e65e42; background:#fff0eb; padding:2px 5px; border-radius:4px; margin-left:4px; } input,textarea { width:100%; border:1px solid #dedbd4; background:#fffefa; border-radius:10px; display:block; padding:12px; color:#252525; font-size:14px; outline:0; margin-top:6px; transition:border .2s, box-shadow .2s; }input:focus,textarea:focus { border-color:#ff856c; box-shadow:0 0 0 3px #ffebe5; }textarea { resize:vertical; }
.images-section { border-top:1px dashed #ded8ce; padding-top:30px; }.hint { color:#777; font-size:11px; margin:-9px 0 13px; }.drop-zone { min-height:142px; border:1.5px dashed #e7b79c; border-radius:14px; background:#fff9f1; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#3b3b3b; transition:.2s; }.drop-zone.dragging,.drop-zone:hover { background:#fff0e2; border-color:#f06445; }.drop-zone input { display:none }.upload-icon { width:39px; height:39px; border-radius:50%; background:#ff704f; color:#fff; display:grid; place-items:center; margin-bottom:8px; box-shadow:0 3px 0 #d44d34 }.drop-zone b { font-size:14px }.drop-zone span { font-size:11px; color:#888; margin-top:3px; }
.image-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:13px; margin-top:16px; }.sticker-card { min-width:0; }.image-frame { border:1px solid #e5e1d9; background:#fff; border-radius:10px; height:134px; display:grid; place-items:center; position:relative; overflow:hidden; }.image-frame img { max-width:100%; max-height:100%; object-fit:contain; }.image-frame span { position:absolute; top:7px; left:7px; color:#fff; background:#29323d; border-radius:4px; padding:2px 5px; font:10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }.image-frame button { position:absolute; right:6px; top:6px; border:0; display:grid; place-items:center; color:#5e5e5e; background:#fff; border-radius:50%; width:25px; height:25px; box-shadow:0 1px 4px #aaa; }.sticker-card>p { margin:6px 0 3px; color:#777; font:10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }.issue,.ok { font-size:10px; display:flex; gap:3px; align-items:center; }.issue { color:#d9593f; }.ok { color:#52966a; }.warning { margin-top:17px; padding:12px; display:flex; gap:9px; background:#fff4ed; color:#c55840; border-radius:10px; font-size:11px; }.warning svg { flex:none; margin-top:2px }.warning p { margin:0; line-height:1.7 }.warning b { font-size:12px; }
.checklist-section { border-top:1px dashed #ded8ce; padding-top:30px; }.checklist { border-top:1px solid #e8e5df; }.checklist>div { min-height:48px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #e8e5df; font-size:12px; }.checklist span { width:19px; height:19px; flex:none; border:1px solid #ccc8c0; border-radius:50%; display:grid; place-items:center; }.checklist .done span { background:#65a979; border-color:#65a979; color:white; }.checklist p { margin:0; }.checklist b { margin-left:auto; color:#5a9b6e; font:11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
.export-card { background:#fff1cf; margin:0 -2px; border-radius:16px; padding:16px; display:grid; grid-template-columns:43px 1fr auto; align-items:center; gap:10px; position:relative; }.export-icon { width:42px; height:42px; background:#ffc75e; color:#5b4218; border-radius:12px; display:grid; place-items:center; }.export-card p { margin:0; font-size:13px; font-weight:700; }.export-card small { color:#826d4d; font-size:10px; }.export-card>svg { color:#b9955c; }.export-card button { grid-column:1/-1; border:0; padding:12px; border-radius:9px; background:#29323d; color:#fff; font-weight:700; font-size:13px; display:flex; justify-content:center; align-items:center; gap:7px; }.export-card button:disabled { background:#aca9a0; cursor:not-allowed; } footer { font-size:10px; color:#9b978f; text-align:center; margin-top:35px; }
@media(min-width:600px) { main { padding-left:30px; padding-right:30px; } .image-grid { grid-template-columns:repeat(3, 1fr); } .image-frame { height:150px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
const MAX_STICKERS = 40
const MAX_WIDTH = 370
const MAX_HEIGHT = 320

const state = { stickers: [], title: '', description: '', exporting: false }
const app = document.querySelector('#root')

function imageIssues(file, width, height) {
  const issues = []
  if (file.type !== 'image/png') issues.push('PNG形式ではありません')
  if (width > MAX_WIDTH || height > MAX_HEIGHT) issues.push('サイズが370 × 320pxを超えています')
  if (file.size > 1024 * 1024) issues.push('ファイルサイズが1MBを超えています')
  return issues
}

function readImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file)
    const image = new Image()
    image.onload = () => resolve({ id: crypto.randomUUID(), file, url, width: image.width, height: image.height, issues: imageIssues(file, image.width, image.height) })
    image.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')) }
    image.src = url
  })
}

async function addFiles(files) {
  const selected = [...files].slice(0, Math.max(0, MAX_STICKERS - state.stickers.length))
  const images = await Promise.all(selected.map((file) => readImage(file).catch(() => null)))
  state.stickers.push(...images.filter(Boolean))
  render()
}

function removeSticker(id) {
  const index = state.stickers.findIndex((sticker) => sticker.id === id)
  if (index >= 0) URL.revokeObjectURL(state.stickers[index].url)
  state.stickers.splice(index, 1)
  render()
}

function checksum(bytes) {
  let crc = -1
  for (const byte of bytes) {
    crc ^= byte
    for (let bit = 0; bit < 8; bit += 1) crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1))
  }
  return (crc ^ -1) >>> 0
}

function u16(value) { return [value & 255, (value >>> 8) & 255] }
function u32(value) { return [value & 255, (value >>> 8) & 255, (value >>> 16) & 255, (value >>> 24) & 255] }

async function zipFiles(files) {
  const encoder = new TextEncoder()
  const entries = await Promise.all(files.map(async ({ name, file }) => ({ name: encoder.encode(name), data: new Uint8Array(await file.arrayBuffer()) })))
  const body = []
  const directory = []
  let directorySize = 0
  let offset = 0
  for (const entry of entries) {
    const crc = checksum(entry.data)
    const header = [80, 75, 3, 4, ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(crc), ...u32(entry.data.length), ...u32(entry.data.length), ...u16(entry.name.length), ...u16(0), ...entry.name]
    body.push(new Uint8Array(header), entry.data)
    const central = new Uint8Array([80, 75, 1, 2, ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(crc), ...u32(entry.data.length), ...u32(entry.data.length), ...u16(entry.name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset), ...entry.name])
    directory.push(central); directorySize += central.length
    offset += header.length + entry.data.length
  }
  const end = new Uint8Array([80, 75, 5, 6, ...u16(0), ...u16(0), ...u16(entries.length), ...u16(entries.length), ...u32(directorySize), ...u32(offset), ...u16(0)])
  return new Blob([...body, ...directory, end], { type: 'application/zip' })
}

async function downloadZip() {
  if (!state.stickers.length || state.exporting) return
  state.exporting = true; render()
  try {
    const info = new File([`タイトル: ${state.title || '未入力'}\n説明: ${state.description || '未入力'}\nスタンプ数: ${state.stickers.length}\n`], 'submission-info.txt', { type: 'text/plain' })
    const files = state.stickers.map((sticker, index) => ({ name: `stickers/${String(index + 1).padStart(2, '0')}.png`, file: sticker.file }))
    files.push({ name: 'submission-info.txt', file: info })
    const link = document.createElement('a')
    link.href = URL.createObjectURL(await zipFiles(files))
    link.download = 'line-stickers.zip'
    link.click(); URL.revokeObjectURL(link.href)
  } finally { state.exporting = false; render() }
}

function checklist() {
  const warnings = state.stickers.reduce((sum, sticker) => sum + sticker.issues.length, 0)
  return [
    ['スタンプのタイトルを入力', Boolean(state.title.trim())], ['スタンプの説明文を入力', Boolean(state.description.trim())], ['画像を1枚以上追加', state.stickers.length > 0],
    ['すべての画像がPNG形式・規定サイズ内', state.stickers.length > 0 && warnings === 0], ['スタンプを8・16・24・32・40個のいずれか用意', [8, 16, 24, 32, 40].includes(state.stickers.length)],
  ]
}

function render() {
  const checks = checklist(); const done = checks.filter(([, complete]) => complete).length; const warningCount = state.stickers.reduce((sum, sticker) => sum + sticker.issues.length, 0)
  app.innerHTML = `<main>
    <header class="topbar"><div class="brand-mark"><span></span><span></span><span></span></div><strong>スタンプ工房</strong><span class="version">Ver.1</span></header>
    <section class="hero"><p class="eyebrow">LINE STICKER MAKER</p><h1>スタンプ制作、<br><em>ここからはじめよう。</em></h1><p>画像を集めて、チェックして、提出用にひとまとめ。</p></section>
    <section class="progress-card"><div><span>制作の進み具合</span><b>${Math.round(done / checks.length * 100)}%</b></div><div class="progress"><i style="width:${done / checks.length * 100}%"></i></div><small>${done} / ${checks.length} の準備が完了</small></section>
    <section class="section"><div class="section-heading"><div><p class="step">01 / DETAILS</p><h2>スタンプ情報</h2></div><span>ⓘ</span></div><label>タイトル <small>必須</small><input id="title" value="${escapeHtml(state.title)}" maxlength="40" placeholder="例：毎日つかえる ねこスタンプ"></label><label>説明文 <small>必須</small><textarea id="description" maxlength="160" placeholder="スタンプの紹介を入力してください" rows="3">${escapeHtml(state.description)}</textarea></label></section>
    <section class="section images-section"><div class="section-heading"><div><p class="step">02 / IMAGES</p><h2>スタンプ画像</h2></div><span class="count">${state.stickers.length} / ${MAX_STICKERS}</span></div><p class="hint">PNG・370 × 320px以内・1MB以内を推奨</p><label class="drop-zone" id="drop-zone"><input id="files" type="file" accept="image/*" multiple><div class="upload-icon">＋</div><b>画像を追加</b><span>タップして選択</span></label>
    ${state.stickers.length ? `<div class="image-grid">${state.stickers.map((sticker, index) => `<article class="sticker-card"><div class="image-frame"><img src="${sticker.url}" alt="スタンプ ${index + 1}"><span>${String(index + 1).padStart(2, '0')}</span><button class="remove" data-id="${sticker.id}" aria-label="${index + 1}番を削除">×</button></div><p>${sticker.width} × ${sticker.height}</p>${sticker.issues.length ? `<div class="issue">⚠ ${sticker.issues[0]}</div>` : '<div class="ok">✓ 確認済み</div>'}</article>`).join('')}</div>` : ''}${warningCount ? `<div class="warning"><b>⚠</b><p><strong>${warningCount}件の確認事項があります</strong><br>画像の形式・サイズを見直してからZIP化してください。</p></div>` : ''}</section>
    <section class="section checklist-section"><div class="section-heading"><div><p class="step">03 / FINAL CHECK</p><h2>提出前チェック</h2></div><span>✓</span></div><div class="checklist">${checks.map(([label, complete]) => `<div class="${complete ? 'done' : ''}"><span>${complete ? '✓' : ''}</span><p>${label}</p>${complete ? '<b>OK</b>' : ''}</div>`).join('')}</div></section>
    <section class="export-card"><div class="export-icon">▣</div><div><p>提出用データを作成</p><small>画像を連番で整理してZIP化します</small></div><span>›</span><button id="export" ${!state.stickers.length || state.exporting ? 'disabled' : ''}>⇩ ${state.exporting ? '作成中...' : 'ZIPを作成'}</button></section><footer>まずは画像の整理から。あなたのスタンプづくりを応援します。</footer></main>`
  document.querySelector('#title').addEventListener('input', (event) => { state.title = event.target.value })
  document.querySelector('#description').addEventListener('input', (event) => { state.description = event.target.value })
  document.querySelector('#title').addEventListener('blur', render)
  document.querySelector('#description').addEventListener('blur', render)
  document.querySelector('#files').addEventListener('change', (event) => addFiles(event.target.files))
  document.querySelector('#drop-zone').addEventListener('dragover', (event) => { event.preventDefault(); event.currentTarget.classList.add('dragging') })
  document.querySelector('#drop-zone').addEventListener('dragleave', (event) => event.currentTarget.classList.remove('dragging'))
  document.querySelector('#drop-zone').addEventListener('drop', (event) => { event.preventDefault(); event.currentTarget.classList.remove('dragging'); addFiles(event.dataTransfer.files) })
  document.querySelectorAll('.remove').forEach((button) => button.addEventListener('click', () => removeSticker(button.dataset.id)))
  document.querySelector('#export').addEventListener('click', downloadZip)
}

function escapeHtml(value) { return value.replace(/[&<>"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[character]) }
render()
    </script>
  </body>
</html>
